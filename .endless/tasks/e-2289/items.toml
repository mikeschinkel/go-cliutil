[[item]]
id = "P1"
kind = "deliverable"
statement = "RegisterCommand returns nothing and only records the command, its type and its parents"
verify = "suite: RegisterCommand returns nothing"

[[item]]
id = "P2"
kind = "deliverable"
statement = "An exported RegisterFlagCommands adds each command's FlagName as a global bool option, and returns one error per conflicting FlagName, carrying ErrCommandRegistrationFailed, command_name and flag_name"
verify = "suite: TestFlagCommands builtin-conflict and two-commands"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Initialize calls SetWriter, RegisterFlagCommands, ValidateCommands and BuildCommandTree, in that order"
verify = "suite: Initialize calls RegisterFlagCommands before ValidateCommands"

[[item]]
id = "P4"
kind = "deliverable"
statement = "RegisterFlagCommands, ValidateCommands and BuildCommandTree each carry a comment saying we plan to unexport them"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A command FlagName and an app AddCLIOption of the same name give one error from Initialize naming the command, whichever is registered first"
verify = "suite: TestFlagCommands option-then-command and command-then-option"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A FlagName command's flag appears in the global flags only after Initialize, with usage \"Run <name> command\", and --<flag> routes to the command"
verify = "suite: TestFlagCommands help-and-routing"

[[item]]
id = "P7"
kind = "deliverable"
statement = "The README's RegisterCommand examples match the new signature, and it says FlagName conflicts are reported by Initialize"

[[item]]
