id = "P45"
kind = "exclusion"
statement = "Does not change any consumer repository or add the go-cfgstore adapter"

[[item]]
id = "P46"
kind = "deliverable"
statement = "go-cliutil defines ConfigApplier with ApplyConfig(Config) error and, each run after typed defaults and before the command line, calls it on the Options value and then on the matched command when they implement it"
verify = "test/ table: config value applied, then overridden by a typed flag"

[[item]]
id = "P47"
kind = "deliverable"
statement = "cliutil.ConfigAs[T](Config) returns the config as T and panics naming both types when it is not a T"

[[item]]
id = "P48"
kind = "deliverable"
statement = "Flag.Source reports config for a flag whose value ApplyConfig changed from its default or that FlagValuer supplied, and command line for a typed flag"

[[item]]
id = "P49"
kind = "deliverable"
statement = "examples/comprehensive gives its config typed methods and uses ApplyConfig on its Options and on one command, with a cliutiltest case where a typed flag beats the config value"

[[item]]
id = "P50"
kind = "deliverable"
statement = "CI and .squire config build the renamed examples, and CI runs examples/comprehensive's tests"

