# Plan items for E-2648: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2648 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "Commands register a CommandFunc into a Registry type through RegisterCommand or Registry.Register, naming parents and DelegateTo by prototype"
verify = "examples/comprehensive registers every command this way; a test registers into NewRegistry"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Every run calls every registered CommandFunc and builds its command tree from those values; no package-level command maps remain"
verify = "grep finds no commandsPathMap, commandsTypeMap, flagCommandMap or commands package variables"

[[item]]
id = "P3"
kind = "deliverable"
statement = "CmdRunnerArgs takes a Registry (nil means DefaultRegistry), a ConfigFunc, an OptionsFunc and a StdIO; there is no SetRegistry"

[[item]]
id = "P4"
kind = "deliverable"
statement = "CommandHandler.Handle takes a HandleArgs and returns an error; CmdBase no longer embeds CmdRunnerArgs"

[[item]]
id = "P5"
kind = "deliverable"
statement = "HandleArgs carries Context, IO, Writer, Logger, Config, Options, Runner, CommandPath, CommandLine, Parameters, Flags and Operands, each with a doc comment stating which words or values it holds"

[[item]]
id = "P6"
kind = "deliverable"
statement = "args.Flag[T](name) returns the flag's typed value and panics, naming the flag, command path and types, when the name is undefined or T is wrong"
verify = "test/ table"

[[item]]
id = "P7"
kind = "deliverable"
statement = "args.OptionsAs[T]() returns the run's Options as T and panics with both type names when it is not a T"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Flags offers Get, All and Passed; each Flag records Name, Value, Source (default, config or command line), Global, Words and Def"

[[item]]
id = "P9"
kind = "deliverable"
statement = "Operands is a slice of Operand (Value, Position, Def) with a Strings method"

[[item]]
id = "P10"
kind = "deliverable"
statement = "The help command declares a variadic operand for the topic and RunCmd has no special case for help"

[[item]]
id = "P11"
kind = "deliverable"
statement = "ArgDef gains a Strings target, MinCount and MaxCount; registration rejects a second ArgDef on a command and count fields on a single-value ArgDef"
verify = "test/ registry validation table"

[[item]]
id = "P12"
kind = "deliverable"
statement = "An operand beyond what the command declares, or outside a variadic's MinCount and MaxCount, is an error shown with the command's usage"

[[item]]
id = "P13"
kind = "deliverable"
statement = "ArgDef and FlagDef declare defaults only in typed fields (DefaultString, DefaultStrings, DefaultBool, DefaultInt, DefaultInt64) matching their target, and Default any is gone"

[[item]]
id = "P14"
kind = "deliverable"
statement = "A positional or flag not given takes its typed default, and help shows that default"

[[item]]
id = "P15"
kind = "deliverable"
statement = "The parser accepts --name, --name=value, --name value, -x, -x value and -x=value, and treats a multi-letter name after a single dash as an unknown flag"

[[item]]
id = "P16"
kind = "deliverable"
statement = "Global flags are accepted before, between and after command words"
verify = "test/ placement table"

[[item]]
id = "P17"
kind = "deliverable"
statement = "A command's flags are accepted anywhere after its last command word and are an error before it"
verify = "test/ placement table using the four endless task show lines from E-2544"

[[item]]
id = "P18"
kind = "deliverable"
statement = "A boolean flag never consumes the following word, and --flag=false sets it false"

[[item]]
id = "P19"
kind = "deliverable"
statement = "-- ends flag parsing; every later word is an operand"

[[item]]
id = "P20"
kind = "deliverable"
statement = "An unknown flag is an error naming the flag"

[[item]]
id = "P21"
kind = "deliverable"
statement = "Registration rejects a command flag named like a global flag"

[[item]]
id = "P22"
kind = "deliverable"
statement = "A command with CmdArgs.Passthrough receives every word after its command words unparsed in Parameters, global flags included"

[[item]]
id = "P23"
kind = "deliverable"
statement = "FlagDef gains a Strings target filled by repeating the flag; with Split set, each value also splits on commas and a backslash-escaped comma stays literal"

[[item]]
id = "P24"
kind = "deliverable"
statement = "Each flag's value comes from the command line, else from config (an ApplyConfig hook, or a Config implementing FlagValuer), else from its typed default; a Required flag is satisfied by either of the first two"

[[item]]
id = "P25"
kind = "deliverable"
statement = "go-cliutil imports no config library; ConfigFunc receives the parsed Flags, AppInfo and IO"
verify = "go.mod requires no config module"

[[item]]
id = "P26"
kind = "deliverable"
statement = "Options is a marker interface; DefaultOptions declares Timeout, Quiet, Verbosity, DryRun and Force; an embeddable GlobalOptions implements it"

[[item]]
id = "P27"
kind = "deliverable"
statement = "NewGlobalOptions takes Omit and Overrides; an omitted flag is not parsed or shown in help, and calling its GlobalOptions method panics"

[[item]]
id = "P28"
kind = "deliverable"
statement = "An app's Options adds global flags through a FlagDefs method whose FlagDefs target the Options value's fields, and OptionsFunc builds a fresh Options each run"

[[item]]
id = "P29"
kind = "deliverable"
statement = "The Flags marker interface, ArgsParser, GlobalFlags, GlobalFlagsArgs, AddCLIFlag, AddCLIOption, ParseOptions, ParseGlobalFlags and ParseGlobalFlagsFromArgs are gone"

[[item]]
id = "P30"
kind = "deliverable"
statement = "SetWriter, GetWriter and the package-level writer are gone; go-cliutil writes only through the run's Writer"

[[item]]
id = "P31"
kind = "deliverable"
statement = "FlagsOnlyMode still runs an app that has no subcommands"

[[item]]
id = "P32"
kind = "deliverable"
statement = "Flag-routed commands (FlagName), --help routing and default-subcommand delegation behave as before"

[[item]]
id = "P33"
kind = "deliverable"
statement = "Two runs in one process never share a flag or operand value"
verify = "test/ runs repo-setup-style lines with and without a bool flag, in both orders and in parallel"

[[item]]
id = "P34"
kind = "deliverable"
statement = "Package cliutiltest in the root module runs a command line in-process and returns Stdout, Stderr, ExitCode and Err, and is safe to run in parallel subtests"

[[item]]
id = "P35"
kind = "deliverable"
statement = "Tests in the test/ module cover every parser rule, registry validation error, default, count limit, config precedence, Omit and Overrides panic, and parallel isolation, and the fuzz and corpus tests run against the new parser"
verify = "go test ./... in test/ with GOWORK=off"

[[item]]
id = "P36"
kind = "deliverable"
statement = "examples/basic_usage is renamed examples/basic and registers and runs at least two commands"

[[item]]
id = "P37"
kind = "deliverable"
statement = "examples/comprehensive demonstrates every feature listed in the plan and includes a cliutiltest table covering its commands"
verify = "go test ./... in examples/comprehensive"

[[item]]
id = "P38"
kind = "deliverable"
statement = "README and docs/BEST-PRACTICES.md describe the new API, and ROADMAP no longer lists variadic positionals or repeated flags"

[[item]]
id = "P39"
kind = "deliverable"
statement = "The request-scoped ADR file's status line says it is superseded by ED-1666, and no new ADR file is added"

[[item]]
id = "P40"
kind = "deliverable"
statement = "Every module builds, vets and lints clean with golangci-lint v2.15.0 or later"

[[item]]
id = "P41"
kind = "deliverable"
statement = "Mike reviews the code and both examples in the task worktree and approves them before the task leaves unverified; the session does not mark it done on its own"

[[item]]
id = "P42"
kind = "deliverable"
statement = "After Mike approves the work, the session proposes v0.6.0 with an active-voice release description that puts code in backticks"
