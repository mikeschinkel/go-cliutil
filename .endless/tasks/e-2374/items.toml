# Plan items for E-2374: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2374 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A branch wip/<task-id>, cut from main's HEAD, holds one commit \"WIP snapshot of main working tree\" whose tree matches main's working tree file for file, .endless/ aside"
verify = "a diff of the branch's tree against main's working tree, staged, unstaged and untracked included, is empty"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The grouping of the snapshot's changes, what each group is for, and anything unexplained are shown to the user, and adjusted with them, before any task is filed"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Every change in the snapshot belongs to a task filed in this project, or is listed as drop with the user's agreement"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Each filed task's plan names the files and hunks it takes from wip/<task-id>"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Every sibling repo whose go.mod replaces this checkout is built against this repo's main HEAD without the WIP, and each group whose removal breaks a build is recorded as blocking the tasks that need it"
verify = "a build of each dependent through a scratch GOWORK pointing this module at a clean checkout"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The user is handed one command that clears main's working tree, to run after confirming wip/<task-id> holds everything"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Does not write to the main checkout"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not use git stash"
