# Plan items for E-2374: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2374 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A branch wip/<task-id>, cut from main's HEAD, holds one commit \"WIP snapshot of main working tree\" whose tree matches main's working tree file for file, .endless/ aside"
verify = "a diff of the branch's tree against main's working tree, staged, unstaged and untracked included, is empty"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The grouping of the snapshot's changes, what each group is for, and anything unexplained are shown to the user, and adjusted with them, before anything is committed to this task's branch"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Every change in the snapshot is committed on this task's branch, moved to a task the user agreed to split out, or listed as drop with the user's agreement"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Each kept group is its own commit on this task's branch, its message saying what the group is for"

[[item]]
id = "P10"
kind = "deliverable"
statement = "The repo builds and its tests pass on this task's branch"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Every sibling repo whose go.mod replaces this checkout builds against this task's branch"
verify = "a build of each dependent through a scratch GOWORK pointing this module at the worktree"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The user is handed one command that clears main's working tree, to run after this task lands"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Does not write to the main checkout"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not use git stash"

[[item]]
id = "P11"
kind = "deliverable"
statement = "The report to the user groups the changes by module, each directory with its own go.mod being a separate, independently versioned module, and lists every module whose contents change"
