name: Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  GO_VERSION: '1.27'

jobs:
  # Fast tests that run on every commit/PR
  test:
    name: Unit and Corpus Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      # test/ is its own module, so the root `go test ./...` does not reach it.
      - name: Run test module tests (unit and fuzz corpus)
        working-directory: test
        run: go test -v -race ./...


  # Note: For extended fuzzing, use the manual workflow or run locally with:
  #   cd test && ./infinite-fuzz.sh

  # Build examples to ensure they compile
  build-examples:
    name: Build Examples
    runs-on: ubuntu-latest

    strategy:
      matrix:
        example: [basic_usage]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-examples-${{ hashFiles('examples/${{ matrix.example }}/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-examples-

      - name: Build example - ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          go mod init example || true
          go mod edit -replace github.com/mikeschinkel/go-cliutil=../..
          go mod tidy
          go build -v .

  # Lint and static analysis
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new linter release can't fail CI without a code change; keep in
          # step with LINTER in the Makefile.
          version: v2.15.0
          args: --timeout=5m
